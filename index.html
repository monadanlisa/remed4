<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kuis Remedial Nilai 4 - Informatika SMP</title>
  <style>
    :root {
      --primary: #2563eb;
      --primary-dark: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --danger: #ef4444;
      --warning: #f59e0b;
      --success: #10b981;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    #app {
      width: 100%;
      max-width: 480px;
      background-color: var(--card-bg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
      position: relative;
    }

    .header {
      background-color: var(--primary);
      color: white;
      padding: 16px;
      text-align: center;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .container {
      padding: 16px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    /* Auth Screen */
    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
    }

    select, button {
      width: 100%;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      font-size: 1rem;
      outline: none;
    }

    select:disabled {
      background-color: #f1f5f9;
    }

    .info-card {
      background-color: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 12px;
      margin: 16px 0;
      font-size: 0.88rem;
      line-height: 1.5;
    }

    .btn-primary {
      background-color: var(--primary);
      color: white;
      border: none;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-primary:active {
      background-color: var(--primary-dark);
    }

    .btn-primary:disabled {
      background-color: #cbd5e1;
      cursor: not-allowed;
    }

    /* Quiz Screen */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }

    .timer {
      font-weight: bold;
      color: var(--danger);
      background: #fef2f2;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.9rem;
    }

    .question-box {
      font-size: 1rem;
      line-height: 1.5;
      font-weight: 600;
      margin-bottom: 16px;
    }

    .options-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .option-btn {
      text-align: left;
      background: #fff;
      border: 1.5px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      font-size: 0.95rem;
      line-height: 1.4;
      cursor: pointer;
      transition: all 0.1s;
    }

    .option-btn.selected {
      border-color: var(--primary);
      background-color: #eff6ff;
      color: var(--primary-dark);
      font-weight: 600;
    }

    .nav-buttons {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 24px;
    }

    .nav-buttons button {
      flex: 1;
    }

    .grid-toggle-btn {
      background-color: #f1f5f9;
      color: var(--text);
      border: 1px solid var(--border);
      margin-top: 12px;
      font-weight: 600;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 16px;
      max-height: 200px;
      overflow-y: auto;
      padding: 4px;
    }

    .grid-item {
      padding: 8px 0;
      text-align: center;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      background: #fff;
      cursor: pointer;
    }

    .grid-item.answered {
      background-color: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .grid-item.active {
      border: 2px solid var(--warning);
    }

    /* Anti-Cheat Overlay */
    #warning-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: rgba(0, 0, 0, 0.95);
      color: white;
      z-index: 9999;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
    }

    #warning-overlay h2 {
      color: var(--danger);
      margin-bottom: 12px;
    }

    #warning-overlay button {
      margin-top: 20px;
      width: auto;
      padding: 10px 24px;
    }

    /* Result Screen */
    .result-box {
      text-align: center;
      padding: 24px 0;
    }

    .score-badge {
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      margin: 12px 0;
    }

    .status-badge {
      display: inline-block;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: bold;
      text-transform: uppercase;
      font-size: 0.9rem;
    }

    .status-badge.lulus {
      background-color: #d1fae5;
      color: #065f46;
    }

    .status-badge.gagal {
      background-color: #fee2e2;
      color: #991b1b;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

<div id="app">
  <div class="header">INFORMATIKA SMP</div>

  <!-- 1. SCREEN AUTENTIKASI -->
  <div id="auth-screen" class="container">
    <h2 style="font-size: 1.2rem; margin-bottom: 16px; text-align: center;">Remedial Nilai 4</h2>
    
    <div class="form-group">
      <label for="select-kelas">Pilih Kelas:</label>
      <select id="select-kelas" onchange="onKelasChange()">
        <option value="">-- Pilih Kelas --</option>
      </select>
    </div>

    <div class="form-group">
      <label for="select-nama">Pilih Nama Siswa:</label>
      <select id="select-nama" disabled onchange="onNamaChange()">
        <option value="">-- Pilih Nama --</option>
      </select>
    </div>

    <div id="student-info" class="info-card hidden"></div>

    <button id="btn-start" class="btn-primary" disabled onclick="startQuiz()">Mulai Kuis Remedial</button>
  </div>

  <!-- 2. SCREEN KUIS -->
  <div id="quiz-screen" class="container hidden">
    <div class="quiz-header">
      <span id="question-progress" style="font-weight: 600; font-size: 0.9rem;">Soal 1 dari 50</span>
      <div class="timer" id="timer-display">60:00</div>
    </div>

    <div class="question-box" id="question-text">Loading Soal...</div>

    <div class="options-container" id="options-box"></div>

    <div class="nav-buttons">
      <button class="btn-primary" style="background:#64748b" id="btn-prev" onclick="prevQuestion()">Kembali</button>
      <button class="btn-primary" id="btn-next" onclick="nextQuestion()">Lanjut</button>
    </div>

    <button class="grid-toggle-btn" onclick="toggleGrid()">Navigasi Soal (Grid)</button>

    <div id="grid-box" class="grid-container hidden"></div>

    <button class="btn-primary" style="background: var(--success); margin-top: 20px;" onclick="confirmSubmit()">Selesaikan Kuis</button>
  </div>

  <!-- 3. SCREEN HASIL -->
  <div id="result-screen" class="container hidden">
    <div class="result-box">
      <h3>Hasil Kuis Remedial 4</h3>
      <div id="result-score" class="score-badge">0</div>
      <div id="result-status" class="status-badge">TIDAK LULUS</div>

      <div class="info-card" id="result-summary" style="margin-top:20px; text-align:left;"></div>

      <button class="btn-primary" style="margin-top: 16px;" onclick="resetToLogin()">Kembali ke Halaman Utama</button>
    </div>
  </div>
</div>

<!-- OVERLAY PERINGATAN KECURANGAN -->

</div>

    { id: 49, q: "Budi melihat informasi dari Gemini bahwa besok libur nasional. Sebelum menyebarkan informasi ke grup kelas, yang harus dilakukan Budi adalah...", opt: ["A. Langsung membagikannya agar menjadi yang pertama tahu", "B. Melakukan verifikasi informasi (fact-checking) ke kalender resmi pemerintah atau pengumuman sekolah", "C. Menyuruh teman-temannya tidak datang ke sekolah", "D. Memarahi Gemini karena memberikan informasi libur"], ans: 1 },
    { id: 50, q: "Siswa menggunakan AI membuat foto rekayasa (deepfake) temannya untuk ejekan. Perbuatan siswa tersebut melanggar...", opt: ["A. Etika digital, privasi, dan aturan hukum cyberbullying", "B. Kecepatan mengetik di komputer", "C. Kapasitas memori penyimpanan ponsel", "D. Tata tertib penggunaan perpustakaan"], ans: 0 },
    { id: 51, q: "Apabila sekolah memiliki panduan resmi penggunaan AI dalam pembelajaran, sikap yang paling bijak adalah...", opt: ["A. Mengabaikannya selama guru tidak mengawasi", "B. Memahami dan mematuhi panduan tersebut sebagai batasan penggunaan AI secara bertanggung jawab", "C. Mengajak teman-teman untuk memprotes panduan tersebut", "D. Menghapus aplikasi AI dari perangkat pribadi"], ans: 1 },
    { id: 52, q: "Pengertian dari plagiarisme dalam konteks penggunaan AI di sekolah adalah...", opt: ["A. Menggunakan AI untuk mencari inspirasi ide", "B. Menyalin karya/teks buatan AI secara utuh dan mengakuinya sebagai hasil pemikiran sendiri", "C. Meminta AI menjelaskan rumus matematika", "D. Memperbaiki tata bahasa tulisan sendiri menggunakan AI"], ans: 1 },
    { id: 53, q: "Sikap kritis yang harus dimiliki siswa saat menerima informasi dari AI adalah...", opt: ["A. Percaya 100% karena AI dikembangkan oleh perusahaan canggih", "B. Selalu bersikap skeptis positif dengan memeriksa fakta dan sumber asli sebelum mempercayainya", "C. Menolak semua jawaban yang diberikan oleh AI", "D. Menganggap AI hanya bisa menjawab soal-soal yang mudah"], ans: 1 },
    { id: 54, q: "Mengapa penting bagi siswa untuk menjaga data privacy (privasi data) saat menggunakan platform AI?", opt: ["A. Untuk melindungi identitas pribadi dari kejahatan siber dan penyalahgunaan data", "B. Supaya baterai ponsel tidak cepat habis", "C. Supaya tampilan aplikasi AI menjadi lebih menarik", "D. Supaya nilai ujian sekolah otomatis meningkat"], ans: 0 },
    { id: 55, q: "Generasi muda yang bijak AI (AI-savvy) adalah mereka yang...", opt: ["A. Menolak menggunakan AI sama sekali", "B. Menggantungkan seluruh tugas dan pemikirannya pada AI", "C. Menguasai cara kerja AI, memanfaatkannya untuk efisiensi, serta tetap mengedepankan etika dan pemikiran kritis mandiri", "D. Menggunakan AI hanya untuk kecurangan"], ans: 2 },
    { id: 56, q: "Program Sertifikasi Gemini untuk Siswa diselenggarakan oleh Google dengan tujuan utama untuk...", opt: ["A. Menguji siapa siswa yang paling cepat mengetik di komputer", "B. Memvalidasi bahwa siswa memiliki literasi AI, etika digital, dan keterampilan prompting yang bertaraf standar", "C. Menggantikan peran ujian nasional di sekolah", "D. Memaksa siswa membeli produk-produk baru Google"], ans: 1 },
    { id: 57, q: "Dalam ujian sertifikasi pembuatan prompt, pilihan jawaban yang paling mungkin BENAR adalah opsi yang...", opt: ["A. Hanya terdiri dari satu kata perintah yang singkat", "B. Memiliki struktur instruksi yang jelas (memuat peran, tugas, konteks, dan format)", "C. Menggunakan bahasa gaul yang tidak baku", "D. Meminta AI mengerjakan ujian sekolah secara utuh"], ans: 1 },
    { id: 58, q: "Sebelum mengklik tombol 'Selesaikan Ujian' pada ujian Sertifikasi Gemini, langkah literasi yang paling tepat adalah...", opt: ["A. Memeriksa kembali seluruh jawaban dengan cermat dan memastikan tidak ada soal yang terlewat", "B. Langsung menutup halaman ujian tanpa memeriksa", "C. Mematikan koneksi internet secara mendadak", "D. Mengubah semua jawaban menjadi opsi A"], ans: 0 },
    { id: 59, q: "Manfaat langsung yang diperoleh siswa setelah lulus dan mendapatkan sertifikat Gemini untuk Siswa adalah...", opt: ["A. Terbebas dari semua tugas sekolah selamanya", "B. Memiliki bukti kredensial resmi literasi AI yang dapat memperkuat portofolio beasiswa atau pendaftaran sekolah/kuliah", "C. Mendapatkan hadiah laptop gratis dari Google", "D. Otomatis diterima di semua universitas tanpa tes"], ans: 1 },
    { id: 60, q: "Kalimat penutup yang paling menggambarkan filosofi penggunaan AI bagi pelajar masa kini adalah...", opt: ["A. 'Biarkan AI berpikir, kita tinggal menerima hasilnya.'", "B. 'Jadikan AI sebagai alat yang memperluas wawasan, sementara otak kita tetap menjadi pengemudinya.'", "C. 'Hindari AI karena teknologi hanya akan membuat manusia menjadi malas.'", "D. 'Gunakan AI hanya saat kita tidak ingin belajar.'"], ans: 1 }
  ];

  // =========================================================================
  // APP STATE & LOGIC
  // =========================================================================
  let currentStudent = null;
  let quizQuestions = [];
  let userAnswers = {};
  let currentQuestionIdx = 0;
  let timerInterval = null;
  let timeRemaining = WAKTU_KUIS_MENIT * 60;
  let violationCount = 0;

  window.onload = function() {
    populateKelasDropdown();
    checkLocalStorageOnLoad();
    setupSecurityListeners();
  };

  function populateKelasDropdown() {
    const kelasSet = [...new Set(studentData.map(s => s.kelas))];
    const selectKelas = document.getElementById('select-kelas');
    selectKelas.innerHTML = '<option value="">-- Pilih Kelas --</option>';
    kelasSet.forEach(k => {
      selectKelas.innerHTML += `<option value="${k}">${k}</option>`;
    });
  }

  function onKelasChange() {
    const kelas = document.getElementById('select-kelas').value;
    const selectNama = document.getElementById('select-nama');
    const infoCard = document.getElementById('student-info');
    const btnStart = document.getElementById('btn-start');

    selectNama.innerHTML = '<option value="">-- Pilih Nama --</option>';
    infoCard.classList.add('hidden');
    btnStart.disabled = true;

    if (!kelas) {
      selectNama.disabled = true;
      return;
    }

    const filteredStudents = studentData.filter(s => s.kelas === kelas);
    filteredStudents.forEach(s => {
      selectNama.innerHTML += `<option value="${s.nama}">${s.nama}</option>`;
    });
    selectNama.disabled = false;
  }

  function onNamaChange() {
    const kelas = document.getElementById('select-kelas').value;
    const nama = document.getElementById('select-nama').value;
    const infoCard = document.getElementById('student-info');
    const btnStart = document.getElementById('btn-start');

    if (!nama) {
      infoCard.classList.add('hidden');
      btnStart.disabled = true;
      return;
    }

    currentStudent = studentData.find(s => s.kelas === kelas && s.nama === nama);

    if (currentStudent) {
      const isLulus = currentStudent.nilaiAwal >= KKM;
      infoCard.innerHTML = `
        <strong>Mata Pelajaran:</strong> Informatika SMP<br>
        <strong>Kategori:</strong> Remedial Nilai 4<br>
        <strong>Nilai Awal:</strong> ${currentStudent.nilaiAwal}<br>
        <strong>Target KKM:</strong> ${KKM}<br>
        <strong>Status Awal:</strong> <span style="color:${isLulus ? 'var(--success)' : 'var(--danger)'}">${isLulus ? 'LULUS KKM' : 'Belum Lulus'}</span>
      `;
      infoCard.classList.remove('hidden');

      if (isLulus) {
        btnStart.disabled = true;
        btnStart.innerText = "Anda Sudah Lulus KKM";
      } else {
        btnStart.disabled = false;
        btnStart.innerText = "Mulai Kuis Remedial";
      }
    }
  }

  function shuffleArray(array) {
    let arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function startQuiz() {
    requestFullScreen();

    const shuffledRaw = shuffleArray(rawQuizData).slice(0, TOTAL_SOAL_DIUJI);
    
    quizQuestions = shuffledRaw.map(q => {
      let optionsWithKey = q.opt.map((optText, index) => ({
        text: optText,
        isCorrect: index === q.ans
      }));
      let shuffledOptions = shuffleArray(optionsWithKey);
      return { q: q.q, options: shuffledOptions };
    });

    userAnswers = {};
    timeRemaining = WAKTU_KUIS_MENIT * 60;
    currentQuestionIdx = 0;
    violationCount = 0;

    saveStateToLocalStorage();
    initQuizUI();
  }

  function initQuizUI() {
    document.getElementById('auth-screen').classList.add('hidden');
    document.getElementById('quiz-screen').classList.remove('hidden');

    renderQuestion();
    renderGrid();
    startTimer();
  }

  function renderQuestion() {
    const qData = quizQuestions[currentQuestionIdx];
    document.getElementById('question-progress').innerText = `Soal ${currentQuestionIdx + 1} dari ${TOTAL_SOAL_DIUJI}`;
    document.getElementById('question-text').innerText = `${currentQuestionIdx + 1}. ${qData.q}`;

    const optionsBox = document.getElementById('options-box');
    optionsBox.innerHTML = '';

    qData.options.forEach((opt, idx) => {
      const isSelected = userAnswers[currentQuestionIdx] === idx;
      const btn = document.createElement('button');
      btn.className = `option-btn ${isSelected ? 'selected' : ''}`;
      btn.innerText = opt.text;
      btn.onclick = () => selectOption(idx);
      optionsBox.appendChild(btn);
    });

    document.getElementById('btn-prev').style.visibility = currentQuestionIdx === 0 ? 'hidden' : 'visible';
    document.getElementById('btn-next').innerText = currentQuestionIdx === TOTAL_SOAL_DIUJI - 1 ? 'Selesai' : 'Lanjut';
    
    updateGridUI();
  }

  function selectOption(optionIndex) {
    userAnswers[currentQuestionIdx] = optionIndex;
    saveStateToLocalStorage();
    renderQuestion();
  }

  function nextQuestion() {
    if (currentQuestionIdx < TOTAL_SOAL_DIUJI - 1) {
      currentQuestionIdx++;
      renderQuestion();
    } else {
      confirmSubmit();
    }
  }

  function prevQuestion() {
    if (currentQuestionIdx > 0) {
      currentQuestionIdx--;
      renderQuestion();
    }
  }

  function renderGrid() {
    const gridBox = document.getElementById('grid-box');
    gridBox.innerHTML = '';
    for (let i = 0; i < TOTAL_SOAL_DIUJI; i++) {
      const item = document.createElement('div');
      item.id = `grid-item-${i}`;
      item.className = 'grid-item';
      item.innerText = i + 1;
      item.onclick = () => {
        currentQuestionIdx = i;
        renderQuestion();
      };
      gridBox.appendChild(item);
    }
    updateGridUI();
  }

  function updateGridUI() {
    for (let i = 0; i < TOTAL_SOAL_DIUJI; i++) {
      const item = document.getElementById(`grid-item-${i}`);
      if (!item) continue;
      
      item.className = 'grid-item';
      if (userAnswers[i] !== undefined) item.classList.add('answered');
      if (i === currentQuestionIdx) item.classList.add('active');
    }
  }

  function toggleGrid() {
    const gridBox = document.getElementById('grid-box');
    gridBox.classList.toggle('hidden');
  }

  function startTimer() {
    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
      timeRemaining--;
      saveStateToLocalStorage();

      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      document.getElementById('timer-display').innerText = 
        `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;

      if (timeRemaining <= 0) {
        clearInterval(timerInterval);
        alert("Waktu habis! Kuis akan otomatis tersubmit.");
        submitQuiz(true);
      }
    }, 1000);
  }

  function saveStateToLocalStorage() {
    const sessionData = {
      student: currentStudent,
      questions: quizQuestions,
      answers: userAnswers,
      time: timeRemaining,
      questionIdx: currentQuestionIdx,
      violations: violationCount
    };
    localStorage.setItem('remedial4_quiz_state', JSON.stringify(sessionData));
  }

  function checkLocalStorageOnLoad() {
    const saved = localStorage.getItem('remedial4_quiz_state');
    if (saved) {
      try {
        const data = JSON.parse(saved);
        if (confirm(`Ditemukan sesi kuis aktif untuk ${data.student.nama}. Lanjutkan pengerjaan?`)) {
          currentStudent = data.student;
          quizQuestions = data.questions;
          userAnswers = data.answers;
          timeRemaining = data.time;
          currentQuestionIdx = data.questionIdx;
          violationCount = data.violations || 0;
          initQuizUI();
        } else {
          localStorage.removeItem('remedial4_quiz_state');
        }
      } catch (e) {
        localStorage.removeItem('remedial4_quiz_state');
      }
    }
  }

  function setupSecurityListeners() {
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('copy', e => e.preventDefault());
    document.addEventListener('paste', e => e.preventDefault());
    document.addEventListener('cut', e => e.preventDefault());
    document.addEventListener('selectstart', e => e.preventDefault());

    document.addEventListener('keydown', e => {
      if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && (e.key === 'I' || e.key === 'J')) || (e.ctrlKey && e.key === 'U')) {
        e.preventDefault();
      }
    });

    window.addEventListener('blur', triggerViolation);
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) triggerViolation();
    });

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement && !document.getElementById('quiz-screen').classList.contains('hidden')) {
        triggerViolation();
      }
    });
  }

  function requestFullScreen() {
    const doc = document.documentElement;
    if (doc.requestFullscreen) doc.requestFullscreen().catch(() => {});
    else if (doc.mozRequestFullScreen) doc.mozRequestFullScreen();
    else if (doc.webkitRequestFullscreen) doc.webkitRequestFullscreen();
    else if (doc.msRequestFullscreen) doc.msRequestFullscreen();
  }

  function triggerViolation() {
    if (document.getElementById('quiz-screen').classList.contains('hidden')) return;

    violationCount++;
    saveStateToLocalStorage();

    if (violationCount >= 2) {
      alert("Anda telah melanggar aturan keamanan kuis sebanyak 2 kali. Sistem akan otomatis mengirimkan jawaban Anda!");
      submitQuiz(true);
    } else {
      document.getElementById('warning-text').innerText = `Pelanggaran Terdeteksi (${violationCount}/2)! Dilarang berpindah aplikasi, split screen, atau keluar dari fullscreen.`;
      document.getElementById('warning-overlay').style.display = 'flex';
    }
  }

  function dismissWarning() {
    document.getElementById('warning-overlay').style.display = 'none';
    requestFullScreen();
  }

  function confirmSubmit() {
    const answeredCount = Object.keys(userAnswers).length;
    if (answeredCount < TOTAL_SOAL_DIUJI) {
      if (!confirm(`Anda baru menjawab ${answeredCount} dari ${TOTAL_SOAL_DIUJI} soal. Yakin ingin menyelesaikan kuis?`)) {
        return;
      }
    } else {
      if (!confirm("Yakin ingin menyelesaikan kuis remedial ini?")) {
        return;
      }
    }
    submitQuiz(false);
  }

  function submitQuiz(isForceSubmit = false) {
    clearInterval(timerInterval);

    let correctCount = 0;
    quizQuestions.forEach((q, idx) => {
      const selectedOptionIdx = userAnswers[idx];
      if (selectedOptionIdx !== undefined && q.options[selectedOptionIdx].isCorrect) {
        correctCount++;
      }
    });

    const finalScore = Math.round((correctCount / TOTAL_SOAL_DIUJI) * 100);

    document.getElementById('quiz-screen').classList.add('hidden');
    document.getElementById('result-screen').classList.remove('hidden');
    document.getElementById('result-score').innerText = finalScore;

    const summaryBox = document.getElementById('result-summary');
    summaryBox.innerHTML = `Mengirim data jawaban ke server, mohon tunggu...`;

    const payload = {
      nama: currentStudent.nama,
      kelas: currentStudent.kelas,
      nilaiAwal: currentStudent.nilaiAwal,
      nilaiRemedial: finalScore
    };

    fetch(GAS_WEB_APP_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(() => {
      const bestScore = Math.max(currentStudent.nilaiAwal, finalScore);
      const finalStatus = bestScore >= KKM ? "LULUS" : "BELUM LULUS";

      document.getElementById('result-status').innerText = finalStatus;
      document.getElementById('result-status').className = `status-badge ${bestScore >= KKM ? 'lulus' : 'gagal'}`;

      summaryBox.innerHTML = `
        <strong>Siswa:</strong> ${currentStudent.nama} (${currentStudent.kelas})<br>
        <strong>Nilai Awal:</strong> ${currentStudent.nilaiAwal}<br>
        <strong>Nilai Remedial Ini:</strong> ${finalScore}<br>
        <strong>Nilai Terbaik (Final):</strong> ${bestScore}<br>
        <strong>Status Final:</strong> ${finalStatus}<br><br>
        <small>*Data hasil kuis telah berhasil tersimpan di Google Sheets guru.</small>
      `;

      localStorage.removeItem('remedial4_quiz_state');
    })
    .catch(err => {
      summaryBox.innerHTML = `Terjadi kesalahan saat menyimpan ke Google Sheets: ${err}. Nilai Anda pada sesi ini: <strong>${finalScore}</strong>`;
      localStorage.removeItem('remedial4_quiz_state');
    });
  }

  function resetToLogin() {
    location.reload();
  }
</script>
